<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kesher — Email verification</title>
  <meta name="description" content="Complete your Kesher email verification or sign-in." />
  <link rel="canonical" href="https://keshersocial.com/verify-email" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./favicon-180.png" />
  <link rel="shortcut icon" href="./favicon-32.png" />
  <style>
    :root {
      --navy: #1A2845;
      --blue: #2563EB;
      --cream: #FAF6EE;
      --muted: #64748b;
      --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--navy);
      padding: 24px;
    }
    main {
      width: min(92vw, 460px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(26, 40, 69, 0.08);
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
    }
    .mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: var(--navy);
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #f1f5f9;
      color: var(--navy);
      font-size: 14px;
    }
    .status.error { background: #fef2f2; color: #b91c1c; }
    .status.success { background: #ecfdf5; color: #047857; }
    a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .footer-link { display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <img src="./favicon-180.png" alt="" width="72" height="72" />
    </div>
    <h1 id="title">Verifying…</h1>
    <p id="subtitle">Please wait while we confirm your email.</p>
    <div id="status" class="status" hidden></div>
    <a class="footer-link" href="https://keshersocial.com">Back to Kesher</a>
  </main>

  <script src="./firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      applyActionCode,
      isSignInWithEmailLink,
      signInWithEmailLink,
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = window.__KESHER_FIREBASE_CONFIG__;
    if (!firebaseConfig?.apiKey || !firebaseConfig?.authDomain || !firebaseConfig?.projectId) {
      throw new Error("Missing website Firebase config. Run scripts/injectWebsiteFirebaseConfig.mjs before deploy.");
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const status = document.getElementById("status");

    const showStatus = (message, kind = "") => {
      status.hidden = false;
      status.textContent = message;
      status.className = "status" + (kind ? ` ${kind}` : "");
    };

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const link = window.location.href;

    try {
      if ((mode === "verifyEmail" || mode === "verifyAndChangeEmail") && oobCode) {
        await applyActionCode(auth, oobCode);
        title.textContent = "Email verified";
        subtitle.textContent =
          "Your Kesher email is confirmed. Return to the app on your iPhone to continue.";
        showStatus(
          "If the app is still open, tap I've verified my email. Otherwise open Kesher and sign in.",
          "success"
        );
      } else if (mode === "signIn" && oobCode && isSignInWithEmailLink(auth, link)) {
        const storedEmail = window.localStorage.getItem("emailForSignIn");
        const email = storedEmail || params.get("email");
        if (!email) {
          title.textContent = "Open on your phone";
          subtitle.textContent =
            "This sign-in link must be opened in the Kesher app on the device where you requested it.";
          showStatus(
            "Return to the Kesher app, request a new link, and tap it from your email on the same phone.",
            "error"
          );
        } else {
          await signInWithEmailLink(auth, email, link);
          window.localStorage.removeItem("emailForSignIn");
          title.textContent = "Signed in";
          subtitle.textContent =
            "Your email is verified. You can close this page and return to the Kesher app.";
          showStatus("Sign-in complete.", "success");
        }
      } else if (isSignInWithEmailLink(auth, link)) {
        const storedEmail = window.localStorage.getItem("emailForSignIn");
        const email = storedEmail || params.get("email");
        if (!email) {
          title.textContent = "Open on your phone";
          subtitle.textContent =
            "This sign-in link must be opened in the Kesher app on the device where you requested it.";
          showStatus(
            "Return to the Kesher app, request a new link, and tap it from your email on the same phone.",
            "error"
          );
        } else {
          await signInWithEmailLink(auth, email, link);
          window.localStorage.removeItem("emailForSignIn");
          title.textContent = "Signed in";
          subtitle.textContent =
            "Your email is verified. You can close this page and return to the Kesher app.";
          showStatus("Sign-in complete.", "success");
        }
      } else if (mode === "action" || !oobCode || !params.get("apiKey")) {
        title.textContent = "Use the link from your email";
        subtitle.textContent =
          "Open the full sign-in or verification link from your Kesher email on this device.";
        showStatus(
          "The URL in Firebase Console uses placeholders like mode=action. Real email links include apiKey and a unique oobCode.",
          "error"
        );
      } else if (!mode && !oobCode) {
        title.textContent = "Open Kesher on your iPhone";
        subtitle.textContent =
          "Tap the sign-in link in your email on the same phone where you requested it. Kesher should open automatically.";
        showStatus(
          "If you see this page after tapping the email link, open the Kesher app manually — you may already be signed in.",
          "success"
        );
      } else {
        title.textContent = "Link not recognized";
        subtitle.textContent = "This link may have expired.";
        showStatus("Request a new sign-in or verification email from the Kesher app.", "error");
      }
    } catch (error) {
      title.textContent = "Something went wrong";
      subtitle.textContent = "We could not complete this email action.";
      showStatus(error?.message || "Try requesting a new link from the Kesher app.", "error");
    }
  </script>
</body>
</html>
